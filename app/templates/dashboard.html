<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Overview | TaskFlow</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/app.js" defer></script>
</head>
<body data-page="dashboard">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-area">
      <header class="topbar" id="topbar"></header>
      <section id="content" class="page-content" aria-live="polite"><div class="loading-state">Gathering your work<span class="loading-dots"></span></div></section>
    </main>
  </div>
  <dialog id="record-dialog" class="record-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
